backend:
  name: git-gateway
  branch: main

locale: pt

media_folder: "assets/img/blog"
public_folder: "/assets/img/blog"

collections:
  - name: "posts"
    label: "Artigos"
    label_singular: "Artigo"
    description: "Textos próprios e comentários sobre artigos que você leu."
    folder: "src/posts"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    preview_path: "blog/{{slug}}/"
    sortable_fields: ["date", "title"]
    summary: "{{title}} — {{date}}"
    fields:
      - label: "Título"
        name: "title"
        widget: "string"

      - label: "Data"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
        default: ""

      - label: "Tipo"
        name: "tipo"
        widget: "select"
        options:
          - "Artigo comentado"
          - "Texto próprio"
        default: "Artigo comentado"

      - label: "Rascunho (não publicar)"
        name: "draft"
        widget: "boolean"
        default: false
        required: false

      - label: "Fonte (revista, jornal ou estudo)"
        name: "fonte"
        widget: "string"
        required: false
        hint: "Só para artigos comentados. Ex.: Revista Veja, PubMed, Jornal da USP."

      - label: "Link da fonte"
        name: "fonte_url"
        widget: "string"
        required: false
        hint: "Endereço completo, começando com https://"

      - label: "Resumo do artigo"
        name: "resumo"
        widget: "text"
        required: false
        hint: "Duas ou três frases sobre o que o artigo diz. Aparece em destaque no post."

      - label: "Imagem de capa"
        name: "imagem"
        widget: "image"
        required: false
        hint: "Opcional. Use foto própria ou imagem com licença livre."

      - label: "Comentário"
        name: "body"
        widget: "markdown"
        hint: "Seu texto. Para artigos comentados, é o que você achou do artigo."

  - name: "pagina_inicial"
    label: "Página inicial"
    files:
      - name: "conteudo"
        label: "Textos da página"
        file: "src/_data/conteudo.json"
        description: "Textos da home. O layout, as cores e as imagens continuam no código."
        fields:
          - label: "Abertura"
            name: "abertura"
            widget: "object"
            fields:
              - label: "Selo acima do título"
                name: "olho"
                widget: "string"
                hint: "O CRN é adicionado automaticamente ao lado."
              - label: "Título — primeira parte"
                name: "tituloInicio"
                widget: "string"
              - label: "Título — trecho em destaque"
                name: "tituloDestaque"
                widget: "string"
                hint: "Aparece na cor vinho."
              - label: "Título — restante"
                name: "tituloFim"
                widget: "string"
                hint: "Comece pela pontuação. Ex.: , em cada fase da vida."
              - label: "Frase de apresentação"
                name: "linha"
                widget: "text"
              - label: "Texto do botão principal"
                name: "botao"
                widget: "string"
              - label: "Texto do link secundário"
                name: "linkSecundario"
                widget: "string"
              - label: "Local e horário"
                name: "local"
                widget: "text"
                hint: "Use Enter para separar as duas linhas."

          - label: "Quem sou eu"
            name: "sobre"
            widget: "object"
            fields:
              - label: "Selo da seção"
                name: "olho"
                widget: "string"
              - label: "Título da seção"
                name: "titulo"
                widget: "string"
              - label: "Parágrafos"
                name: "paragrafos"
                widget: "list"
                field:
                  label: "Parágrafo"
                  name: "texto"
                  widget: "text"
              - label: "Assinatura"
                name: "assinatura"
                widget: "string"
              - label: "Título do cartão"
                name: "cartaoTitulo"
                widget: "string"
              - label: "Formação e experiência"
                name: "credenciais"
                widget: "list"
                field:
                  label: "Item"
                  name: "item"
                  widget: "string"

          - label: "Como funciona a consulta"
            name: "atendimento"
            widget: "object"
            fields:
              - label: "Selo da seção"
                name: "olho"
                widget: "string"
              - label: "Título da seção"
                name: "titulo"
                widget: "string"
              - label: "Frase de apoio"
                name: "linha"
                widget: "text"
              - label: "Passos"
                name: "passos"
                widget: "list"
                fields:
                  - label: "Título do passo"
                    name: "titulo"
                    widget: "string"
                  - label: "Texto do passo"
                    name: "texto"
                    widget: "text"
              - label: "Modalidades"
                name: "modalidades"
                widget: "list"
                fields:
                  - label: "Rótulo"
                    name: "rotulo"
                    widget: "string"
                  - label: "Texto"
                    name: "texto"
                    widget: "string"
              - label: "Título de O que atendo"
                name: "servicosTitulo"
                widget: "string"
              - label: "O que atendo"
                name: "servicos"
                widget: "list"
                fields:
                  - label: "Título"
                    name: "titulo"
                    widget: "string"
                  - label: "Texto"
                    name: "texto"
                    widget: "text"

          - label: "Seção de artigos"
            name: "artigos"
            widget: "object"
            fields:
              - label: "Selo da seção"
                name: "olho"
                widget: "string"
              - label: "Título da seção"
                name: "titulo"
                widget: "string"
              - label: "Frase de apoio"
                name: "linha"
                widget: "text"

          - label: "Contato"
            name: "contato"
            widget: "object"
            fields:
              - label: "Selo da seção"
                name: "olho"
                widget: "string"
              - label: "Título da seção"
                name: "titulo"
                widget: "string"
              - label: "Título do cartão de WhatsApp"
                name: "acaoTitulo"
                widget: "string"
              - label: "Texto do cartão de WhatsApp"
                name: "acaoTexto"
                widget: "text"
              - label: "Texto do botão de WhatsApp"
                name: "acaoBotao"
                widget: "string"

  - name: "configuracoes"
    label: "Configurações"
    files:
      - name: "site"
        label: "Dados do site"
        file: "src/_data/config.json"
        description: "Telefone, WhatsApp, endereço e horário usados no site."
        fields:
          - label: "Nome"
            name: "nome"
            widget: "string"
          - label: "CRN"
            name: "crn"
            widget: "string"
          - label: "Telefone (como aparece)"
            name: "telefone"
            widget: "string"
          - label: "Telefone com DDI (só números)"
            name: "telefoneDigitos"
            widget: "string"
            hint: "Ex.: 5515996110107. Usado para montar o link do WhatsApp."
          - label: "Mensagem inicial do WhatsApp"
            name: "mensagemWhatsapp"
            widget: "text"
            hint: "Texto que já vem escrito quando o visitante clica no botão."
          - label: "Endereço (linha 1)"
            name: "endereco"
            widget: "string"
          - label: "Endereço (linha 2)"
            name: "enderecoComplemento"
            widget: "string"
          - label: "Horário"
            name: "horario"
            widget: "string"
          - label: "Complemento do horário"
            name: "horarioObs"
            widget: "string"
          - label: "Atendimento online"
            name: "online"
            widget: "string"
          - label: "Endereço do site (URL)"
            name: "siteUrl"
            widget: "string"
            hint: "Ex.: https://patriciarodriguesnutri.com.br. Usado em metadados."
