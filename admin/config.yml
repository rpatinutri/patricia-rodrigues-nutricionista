backend:
  name: git-gateway
  branch: main

locale: pt

media_folder: "assets/img/blog"
public_folder: "/assets/img/blog"

collections:
  - name: "posts"
    label: "Artigos"
    label_singular: "Artigo"
    description: "Textos próprios e comentários sobre artigos que você leu."
    folder: "src/posts"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    preview_path: "blog/{{slug}}/"
    sortable_fields: ["date", "title"]
    summary: "{{title}} — {{date}}"
    fields:
      - label: "Título"
        name: "title"
        widget: "string"

      - label: "Data"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
        default: ""

      - label: "Tipo"
        name: "tipo"
        widget: "select"
        options:
          - "Artigo comentado"
          - "Texto próprio"
        default: "Artigo comentado"

      - label: "Rascunho (não publicar)"
        name: "draft"
        widget: "boolean"
        default: false
        required: false

      - label: "Fonte (revista, jornal ou estudo)"
        name: "fonte"
        widget: "string"
        required: false
        hint: "Só para artigos comentados. Ex.: Revista Veja, PubMed, Jornal da USP."

      - label: "Link da fonte"
        name: "fonte_url"
        widget: "string"
        required: false
        hint: "Endereço completo, começando com https://"

      - label: "Resumo do artigo"
        name: "resumo"
        widget: "text"
        required: false
        hint: "Duas ou três frases sobre o que o artigo diz. Aparece em destaque no post."

      - label: "Imagem de capa"
        name: "imagem"
        widget: "image"
        required: false
        hint: "Opcional. Use foto própria ou imagem com licença livre."

      - label: "Comentário"
        name: "body"
        widget: "markdown"
        hint: "Seu texto. Para artigos comentados, é o que você achou do artigo."
